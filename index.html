<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MetsästysGPS - MML Maastokartta</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; z-index: 1; }
    .glass-panel { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .bark-pulse {
      position: absolute; width: 44px; height: 44px; border-radius: 50%;
      background: rgba(239, 68, 68, 0.4); border: 2px solid #ef4444;
      animation: pulse-ring 1.2s infinite ease-in-out; pointer-events: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 select-none">

  <!-- Yläpalkki -->
  <header class="fixed top-0 left-0 right-0 z-20 h-14 glass-panel flex items-center justify-between px-4 shadow-lg">
    <div class="flex items-center gap-2">
      <div class="bg-emerald-600 p-2 rounded-lg text-white">
        <i data-lucide="compass" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm leading-tight text-emerald-400">MetsästysGPS</h1>
        <p class="text-[10px] text-slate-400">MML Maastokartta</p>
      </div>
    </div>

    <!-- Työkalut & Tila -->
    <div class="flex items-center gap-2">
      <button id="drawPassBtn" onclick="toggleDrawMode('pass')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 border border-slate-700 hover:bg-slate-700 transition flex items-center gap-1.5">
        <i data-lucide="map-pin" class="w-4 h-4 text-emerald-400"></i> +Passi
      </button>
      <button id="drawBorderBtn" onclick="toggleDrawMode('border')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 border border-slate-700 hover:bg-slate-700 transition flex items-center gap-1.5">
        <i data-lucide="pentagon" class="w-4 h-4 text-amber-400"></i> +Raja
      </button>
      <button onclick="toggleSidebar()" class="p-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700">
        <i data-lucide="menu" class="w-5 h-5 text-slate-300"></i>
      </button>
    </div>
  </header>

  <!-- Sivupaneeli -->
  <aside id="sidebar" class="fixed top-14 right-0 bottom-0 z-20 w-80 glass-panel translate-x-full transition-transform duration-300 p-4 overflow-y-auto flex flex-col gap-4">
    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
      <h2 class="font-bold text-sm text-slate-200">Seurue & Merkinnät</h2>
      <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <div>
      <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Aktiiviset Kohteet</h3>
      <div id="trackerList" class="space-y-2">
        <!-- Generoidaan JS:ssä -->
      </div>
    </div>

    <div>
      <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Tallennetut Pisteet</h3>
      <div id="markersList" class="space-y-2 text-xs">
        <p class="text-slate-500 italic">Ei omia merkintöjä vielä.</p>
      </div>
    </div>
  </aside>

  <!-- Kartta-alue -->
  <div id="map"></div>

  <!-- Alapalkki / Pikavalinnat -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 glass-panel px-4 py-2 rounded-full flex items-center gap-4 shadow-2xl">
    <button onclick="centerOnUser()" class="flex items-center gap-1.5 text-xs font-semibold text-emerald-400 hover:text-emerald-300">
      <i data-lucide="crosshair" class="w-4 h-4"></i> Oma sijainti
    </button>
    <div class="w-px h-4 bg-slate-700"></div>
    <button onclick="switchLayer()" class="flex items-center gap-1.5 text-xs font-semibold text-slate-300 hover:text-white">
      <i data-lucide="layers" class="w-4 h-4 text-amber-400"></i> Vaihda karttaa
    </button>
  </div>

  <script>
    lucide.createIcons();

    const mmlApiKey = '790bca4e-b774-4a10-b635-d7436231c183';

    // Maanmittauslaitoksen (MML) Maastokartta WMTS
    const mmlMaastokartta = L.tileLayer(`https://avoin-karttakuva.maanmittauslaitos.fi/avoin/wmts/1.0.0/maastokartta/default/WGS84_Pseudo-Mercator/{z}/{y}/{x}.png?api-key=${mmlApiKey}`, {
      maxZoom: 18,
      minZoom: 0,
      tileSize: 256,
      attribution: '&copy; Maanmittauslaitos'
    });

    // Varamappina satelliitti (Esri)
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Esri &mdash; Esri, DeLorme, NAVTEQ'
    });

    const map = L.map('map', {
      center: [60.2055, 24.6559], // Kirkkonummi / Uusimaa oletus
      zoom: 13,
      layers: [mmlMaastokartta],
      zoomControl: false
    });

    L.control.zoom({ position: 'topleft' }).addTo(map);

    let currentLayerIndex = 0;
    const layers = [mmlMaastokartta, satLayer];
    const layerNames = ["MML Maastokartta", "Satelliitti"];

    function switchLayer() {
      map.removeLayer(layers[currentLayerIndex]);
      currentLayerIndex = (currentLayerIndex + 1) % layers.length;
      map.addLayer(layers[currentLayerIndex]);
      alert("Vaihdettu karttaan: " + layerNames[currentLayerIndex]);
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('translate-x-full');
    }

    const trackingData = [
      { id: 1, name: "Haukkari (Suomenajok.)", type: "dog", lat: 60.21, lng: 24.67, status: "Haukkuu (82 bpm)", color: "#ef4444" },
      { id: 2, name: "Mikkolainen (Passi 4)", type: "hunter", lat: 60.20, lng: 24.64, status: "Paikallaan", color: "#3b82f6" },
      { id: 3, name: "Musti (Karhunk.)", type: "dog", lat: 60.215, lng: 24.63, status: "Hakemassa", color: "#f59e0b" }
    ];

    const trackerListEl = document.getElementById('trackerList');
    trackingData.forEach(item => {
      const div = document.createElement('div');
      div.className = "glass-panel p-2.5 rounded-lg flex items-center justify-between text-xs";
      div.innerHTML = `
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full" style="background:${item.color}"></div>
          <div>
            <p class="font-bold text-slate-200">${item.name}</p>
            <p class="text-[10px] text-slate-400">${item.status}</p>
          </div>
        </div>
        <button onclick="panTo(${item.lat}, ${item.lng})" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-emerald-400 font-semibold">Seuraa</button>
      `;
      trackerListEl.appendChild(div);

      L.circleMarker([item.lat, item.lng], {
        radius: 8,
        fillColor: item.color,
        color: '#fff',
        weight: 2,
        fillOpacity: 0.9
      }).addTo(map).bindPopup(`<b>${item.name}</b><br>${item.status}`);
    });

    function panTo(lat, lng) {
      map.setView([lat, lng], 15);
      toggleSidebar();
    }

    function centerOnUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 15);
        }, () => {
          alert("GPS-paikannus ei onnistunut.");
        });
      } else {
        alert("Selaimesi ei tue paikannusta.");
      }
    }

    let drawMode = null;
    let markers = [];

    function toggleDrawMode(mode) {
      drawMode = drawMode === mode ? null : mode;
      document.getElementById('drawPassBtn').classList.toggle('border-emerald-500', drawMode === 'pass');
      document.getElementById('drawBorderBtn').classList.toggle('border-amber-500', drawMode === 'border');
      if (drawMode) alert(`Klikkaa kartalle lisätäksesi ${drawMode === 'pass' ? 'passipisteen' : 'rajapisteen'}.`);
    }

    map.on('click', function(e) {
      if (!drawMode) return;
      const color = drawMode === 'pass' ? '#10b981' : '#f59e0b';
      L.circleMarker(e.latlng, {
        radius: 7,
        fillColor: color,
        color: '#fff',
        weight: 2,
        fillOpacity: 1
      }).addTo(map).bindPopup(`${drawMode === 'pass' ? 'Passipiste' : 'Raja'} (${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)})`).openPopup();
      
      markers.push({ type: drawMode, latlng: e.latlng });
      updateMarkersList();
    });

    function updateMarkersList() {
      const listEl = document.getElementById('markersList');
      if (markers.length === 0) {
        listEl.innerHTML = '<p class="text-slate-500 italic">Ei omia merkintöjä vielä.</p>';
        return;
      }
      listEl.innerHTML = '';
      markers.forEach((m, idx) => {
        const row = document.createElement('div');
        row.className = "flex justify-between items-center bg-slate-800/50 p-1.5 rounded mb-1";
        row.innerHTML = `<span>#${idx+1} ${m.type === 'pass' ? 'Passi' : 'Raja'} (${m.latlng.lat.toFixed(3)}, ${m.latlng.lng.toFixed(3)})</span>`;
        listEl.appendChild(row);
      });
    }

    setTimeout(() => { map.invalidateSize(); }, 200);
  </script>
</body>
</html>
