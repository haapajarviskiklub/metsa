<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MetsästysGPS - Live-seuranta</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://metsastysgps-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Haetaan ryhmä URL:stä tai luodaan oletus
    const urlParams = new URLSearchParams(window.location.search);
    let groupId = urlParams.get('ryhma') || 'metsaseura-' + Math.floor(Math.random() * 9000 + 1000);
    
    // Generoidaan tai haetaan laitekohtainen ID
    let myUserId = localStorage.getItem('metsays_uid');
    if (!myUserId) {
      myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('metsays_uid', myUserId);
    }

    let myName = localStorage.getItem('metsays_name') || ('Metsästäjä ' + Math.floor(Math.random() * 90 + 10));
    let myType = localStorage.getItem('metsays_type') || 'hunter';
    let myStatus = "Valmiina";

    document.getElementById('groupNameInput').value = groupId;
    document.getElementById('myUserName').value = myName;
    document.getElementById('activeGroupName').innerText = "Ryhmä: " + groupId;

    window.updateSettings = function() {
      myName = document.getElementById('myUserName').value;
      myType = document.getElementById('myMemberType').value;
      groupId = document.getElementById('groupNameInput').value.trim() || 'metsaseura-yleinen';
      
      localStorage.setItem('metsays_name', myName);
      localStorage.setItem('metsays_type', myType);

      const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?ryhma=' + encodeURIComponent(groupId);
      window.history.pushState({path:newUrl}, '', newUrl);
      document.getElementById('activeGroupName').innerText = "Ryhmä: " + groupId;

      alert("Asetukset päivitetty!");
      initFirebaseSync();
    };

    window.copyInviteLink = function() {
      const link = window.location.href;
      navigator.clipboard.writeText(link).then(() => {
        alert("Liittymislinkki kopioitu leikepöydälle! Lähetä se muille ryhmän jäsenille.");
      });
    };

    // Kartan alustus
    const mmlApiKey = '790bca4e-b774-4a10-b635-d7436231c183';
    const mmlMaastokartta = L.tileLayer(`https://avoin-karttakuva.maanmittauslaitos.fi/avoin/wmts/1.0.0/maastokartta/default/WGS84_Pseudo-Mercator/{z}/{y}/{x}.png?api-key=${mmlApiKey}`, {
      maxZoom: 18, minZoom: 0, tileSize: 256, attribution: '&copy; MML'
    });
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

    const map = L.map('map', {
      center: [60.2055, 24.6559], zoom: 13, layers: [mmlMaastokartta], zoomControl: false
    });
    L.control.zoom({ position: 'topleft' }).addTo(map);

    let currentLayerIndex = 0;
    const layers = [mmlMaastokartta, satLayer];
    const layerNames = ["MML Maastokartta", "Satelliitti"];

    window.switchLayer = function() {
      map.removeLayer(layers[currentLayerIndex]);
      currentLayerIndex = (currentLayerIndex + 1) % layers.length;
      map.addLayer(layers[currentLayerIndex]);
    };

    window.toggleSidebar = function() {
      document.getElementById('sidebar').classList.toggle('translate-x-full');
    };

    let memberMarkers = {};
    let trackingData = {};

    function initFirebaseSync() {
      const groupRef = ref(db, 'groups/' + groupId + '/members');

      // Kuunnellaan ryhmän jäsenten sijainteja reaaliajassa
      onValue(groupRef, (snapshot) => {
        const data = snapshot.val() || {};
        trackingData = data;
        renderTrackingList();
      });

      // Lähetetään oma GPS-sijainti pilveen jatkuvasti
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          const myRef = ref(db, 'groups/' + groupId + '/members/' + myUserId);
          set(myRef, {
            name: myName,
            type: myType,
            lat: lat,
            lng: lng,
            status: myStatus,
            color: myType === 'dog' ? '#ef4444' : '#3b82f6',
            lastUpdated: Date.now()
          });
        }, (err) => {
          console.warn("GPS-virhe: ", err.message);
        }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 });
      }
    }

    function renderTrackingList() {
      const trackerListEl = document.getElementById('trackerList');
      trackerListEl.innerHTML = '';
      document.getElementById('memberCount').innerText = Object.keys(trackingData).length;

      // Poistetaan poistuneet markkerit kartalta
      Object.keys(memberMarkers).forEach(id => {
        if (!trackingData[id]) {
          map.removeLayer(memberMarkers[id]);
          delete memberMarkers[id];
        }
      });

      Object.entries(trackingData).forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = "glass-panel p-2.5 rounded-lg flex items-center justify-between text-xs";
        div.innerHTML = `
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full flex-shrink-0" style="background:${item.color}"></div>
            <div>
              <p class="font-bold text-slate-200">${item.name} ${id === myUserId ? '(Sinä)' : ''}</p>
              <p class="text-[10px] text-slate-400">${item.status}</p>
            </div>
          </div>
          <button onclick="panTo(${item.lat}, ${item.lng})" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-emerald-400 font-semibold">Seuraa</button>
        `;
        trackerListEl.appendChild(div);

        // Päivitetään tai luodaan karttamerkki
        if (memberMarkers[id]) {
          memberMarkers[id].setLatLng([item.lat, item.lng]);
          memberMarkers[id].getPopup().setContent(`<b>${item.name}</b><br>${item.status}`);
        } else {
          const marker = L.circleMarker([item.lat, item.lng], {
            radius: 8,
            fillColor: item.color,
            color: '#fff',
            weight: 2,
            fillOpacity: 0.9
          }).addTo(map).bindPopup(`<b>${item.name}</b><br>${item.status}`);
          memberMarkers[id] = marker;
        }
      });
      lucide.createIcons();
    }

    window.panTo = function(lat, lng) {
      map.setView([lat, lng], 15);
      toggleSidebar();
    };

    window.centerOnUser = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 15);
        }, () => alert("GPS-paikannus ei onnistunut. Salli sijainti selaimen asetuksista."));
      }
    };

    setTimeout(() => {
      initFirebaseSync();
      map.invalidateSize();
    }, 300);
  </script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; z-index: 1; }
    .glass-panel { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 select-none">

  <!-- Yläpalkki -->
  <header class="fixed top-0 left-0 right-0 z-20 h-14 glass-panel flex items-center justify-between px-4 shadow-lg">
    <div class="flex items-center gap-2">
      <div class="bg-emerald-600 p-2 rounded-lg text-white">
        <i data-lucide="compass" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm leading-tight text-emerald-400">MetsästysGPS</h1>
        <p id="activeGroupName" class="text-[10px] text-slate-400">Ryhmä: Ladataan...</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="toggleSidebar()" class="p-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700">
        <i data-lucide="menu" class="w-5 h-5 text-slate-300"></i>
      </button>
    </div>
  </header>

  <!-- Sivupaneeli -->
  <aside id="sidebar" class="fixed top-14 right-0 bottom-0 z-20 w-80 glass-panel translate-x-full transition-transform duration-300 p-4 overflow-y-auto flex flex-col gap-4">
    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
      <h2 class="font-bold text-sm text-slate-200">Ryhmän hallinta & Kutsu</h2>
      <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Kutsu ja asetukset -->
    <div class="bg-slate-800/40 p-3 rounded-lg border border-slate-700/50 space-y-3">
      <button onclick="copyInviteLink()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded text-xs transition flex items-center justify-center gap-1.5 shadow">
        <i data-lucide="share-2" class="w-4 h-4"></i> Kopioi liittymislinkki kavereille
      </button>

      <div class="border-t border-slate-700/50 pt-2 space-y-2">
        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Oma nimesi tai koira</label>
          <input type="text" id="myUserName" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Rooli</label>
            <select id="myMemberType" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
              <option value="hunter">Metsästäjä / Passi</option>
              <option value="dog">Koira</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Ryhmän koodi</label>
            <input type="text" id="groupNameInput" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          </div>
        </div>
        <button onclick="updateSettings()" class="w-full py-1.5 bg-slate-700 hover:bg-slate-600 text-emerald-400 font-semibold rounded text-xs transition">Tallenna asetukset</button>
      </div>
    </div>

    <div>
      <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Paikalla olevat (<span id="memberCount">0</span>)</h3>
      <div id="trackerList" class="space-y-2">
        <!-- Generoidaan livenä -->
      </div>
    </div>
  </aside>

  <!-- Kartta-alue -->
  <div id="map"></div>

  <!-- Alapalkki -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 glass-panel px-4 py-2 rounded-full flex items-center gap-4 shadow-2xl">
    <button onclick="centerOnUser()" class="flex items-center gap-1.5 text-xs font-semibold text-emerald-400 hover:text-emerald-300">
      <i data-lucide="crosshair" class="w-4 h-4"></i> Oma sijainti
    </button>
    <div class="w-px h-4 bg-slate-700"></div>
    <button onclick="switchLayer()" class="flex items-center gap-1.5 text-xs font-semibold text-slate-300 hover:text-white">
      <i data-lucide="layers" class="w-4 h-4 text-amber-400"></i> Vaihda karttaa
    </button>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
